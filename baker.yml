
# CS3704 — agent-template
#
# Students run this from INSIDE their clone:
#
#   git clone https://github.com/CS3704-VT/agent-template
#   cd agent-template
#   baker bake .
#   baker run setup
#
# `local: {}` is the current directory, so the cd is not optional.

name: cs3704-agent-template

local: {}

tools:
  - opunit
  - claude-code:
      install: npm   # npm install -g @anthropic-ai/claude-code


config:
  - files:
      # Installs the pre-commit hook directly. hooks/setup-git-hooks.sh
      # iterates the repo root rather than hooks/, so it copies README.md and
      # friends into .git/hooks and never installs pre-commit.
      - src: ./hooks/pre-commit
        dest: .git/hooks/pre-commit
        mode: "0755"

commands:
  # Orientation, not work. Everything this repo needs is done by `baker bake`;
  # analyze and the goal exercise are interactive and belong to the student, so
  # setup points at them rather than driving them.
  setup: >-
    echo "" &&
    echo "🍞 Your CS3704 environment is baked and ready." &&
    echo "" &&
    echo "🧑‍🍳 Next, in order:" &&
    echo "   1. baker run assignment          start the assignment agent, then: analyze HW1" &&
    echo "   2. baker run claude              start the default session (Shift+Tab = Plan Mode)" &&
    echo "   3. /learning-goal                set your goals for it (10-15 min)" &&
    echo "" &&
    echo "🥖 Other agents: baker run dcbrown | requirements | product | ux | architect" &&
    echo "   Needs ARC_API_KEY set and the VT network/VPN. Bare 'claude' does not use ARC." &&
    echo "⏲️  Something looks off? Contact dcbrown" &&
    echo ""

  # Launchers — every session goes through ARC via .claude/scripts/arc-claude.sh.
  claude: .claude/scripts/arc-claude.sh
  dcbrown: .claude/scripts/arc-claude.sh --agent dcbrown
  assignment: .claude/scripts/arc-claude.sh --agent assignment
  requirements: .claude/scripts/arc-claude.sh --agent requirements-analyst
  product: .claude/scripts/arc-claude.sh --agent product-manager
  ux: .claude/scripts/arc-claude.sh --agent ux-ui-designer
  architect: .claude/scripts/arc-claude.sh --agent system-architect
